<!DOCTYPE html>
<html>
<head>
<style>
body{
	margin:0;
}
#header{
	border:1px solid #ccc;
	border-bottom:1px solid #aaa;
	height:150px;
}
#header > .top{
	//border:1px solid red;
	height:100px;
	background:rgba(86,90,93,1);
}


#header > .top > .holder,
#header > .bottom > .menu{
	//border:3px solid green;	
	width:800px;
	height:100%;
	margin:auto;
}

#header > .top > .holder > .top{
	border:3px solid transparent;;	
	height:30%;	
}
#header > .top > .holder > .bottom{
	//border:1px solid transprent;	
	height:70%;	
	direction:rtl;
}
#header > .top > .holder > .bottom > .logo{
	height:87%;
	float:right;
}
#header > .top > .holder > .bottom > .search:hover{
	background:#fff;
	color:#222;
	width:140px;
}
#header > .top > .holder > .bottom > .search{
	outline:0 none;
	transition:0.3s;
	width:100px;
	height:20px;
	float:left;
	border-radius:5px;
	font-size:10px;
	border:0 none;
	margin:20px;
	background:#333;
	color:#fff;
	text-indent:10px;
	
	box-shadow:0 0 10px 1px #ccc inset;
}
#header > .bottom{
	//border:1px solid red;
	height:50px;
	background:rgba(245,245,245,1);
}
#header > .bottom > .menu{
	width:600px
}
#header > .bottom > .menu > .items{
	float:right;
	font-family:tahoma;
	padding:0 20px;
	font-size:13px;
	line-height:60px;
}
#header > .bottom > .menu > .it1{
	color:red;
}
#content{
	border:1px solid #eee;
	height:1200px;
	
	background:url("images/content_bg.jpg") repeat-x;
}
#footer{
	border-top:1px solid red;
	height:250px;
	background:rgba(86,90,93,1);
}
</style>

</head>
<body>

<div id="header">  
	<div class="top"> 
		<div class="holder"> 
			<div class="top">  </div>
			<div class="bottom"> 
				<img class="logo" src="images/header_logo.png">
				<input class="search" type="text" placeholder="جستجو . . .">
			</div>
		</div>	
	</div>
	<div class="bottom">  
		<div class="menu"> 	
			<div class="items"> صفحه اصلی </div>
			<div class="items"> درباره ملت </div>
			<div class="items"> خدمات </div>
			<div class="items"> بانکداری الکترونیکی</div>
			<div class="items it1"> همراه بانک</div>			
		</div>			
	</div>
</div>

<div id="content"> 



</div>
<div id="footer"> 

</div>

</body>
</html>
