<!DOCTYPE html>
<html>
<head>
<style>
body{
	margin:0;
}
#header{
	border:1px solid #ccc;
	border-bottom:1px solid #aaa;
	height:150px;
}
#header > .top{
	//border:1px solid red;
	height:100px;
	background:rgba(86,90,93,1);
}


#header > .top > .holder,
#header > .bottom > .menu{
	//border:3px solid green;	
	width:800px;
	height:100%;
	margin:auto;
}

#header > .top > .holder > .top{
	border:3px solid transparent;;	
	height:30%;	
}
#header > .top > .holder > .bottom{
	//border:1px solid transprent;	
	height:70%;	
	direction:rtl;
}
#header > .top > .holder > .bottom > .logo{
	height:87%;
	float:right;
}
#header > .top > .holder > .bottom > .search:hover{
	background:#fff;
	color:#222;
	width:140px;
}
#header > .top > .holder > .bottom > .search{
	outline:0 none;
	transition:0.3s;
	width:100px;
	height:20px;
	float:left;
	border-radius:5px;
	font-size:10px;
	border:0 none;
	margin:20px;
	background:#333;
	color:#fff;
	text-indent:10px;
	
	box-shadow:0 0 10px 1px #ccc inset;
}
#header > .bottom{
	//border:1px solid red;
	height:50px;
	background:rgba(245,245,245,1);
}
#header > .bottom > .menu{
	width:600px
}
#header > .bottom > .menu > .items{
	float:right;
	font-family:tahoma;
	padding:0 20px;
	font-size:13px;
	line-height:60px;
}
#header > .bottom > .menu > .it1{
	color:red;
}
#header > .bottom > .menu > .sub{
	background:url("images/down.png") no-repeat 0% 50%;
}



#content{
	border:1px solid #eee;
	height:1200px;
	
	background:url("images/content_bg.jpg") repeat-x;
}
#footer{
	border-top:1px solid red;
	height:250px;
	background:rgba(86,90,93,1);
}

/*   slider   */


#slider{
	//border:1px solid red;
	width:800px;
	height:300px;
	margin:30px auto;
	
	position:relative;
	overflow:hidden;
}
#slider > #gal{
	//border:1px solid red;
	width:500%;
	height:100%;
	
	transition:0.5s;
	position:relative;
	left:0;
}
#slider > #gal > .items{
	width:20%;
	height:100%;
	float:left;
}
#slider > #gal > .items > img{
	width:100%;
	height:100%;
}
#slider > #gal > .items:hover > p{
	top:-43px;
}
#slider > #gal > .items > p{
	transition:0.5s;
	position:relative;
	top:0;
	
	background:rgba(0,0,0,0.6);
	margin:0;
	padding:10px;
	text-align:center;
	font-family:tahoma;
	color:#fff;
}

#slider:hover > #right{
	right:0;
}
#slider:hover > #left{
	left:0;
}
#slider > #right{
	transition:0.3s;
	width:50px;
	height:70px;
	background:red url("img/slider/right.png") no-repeat 50%;
	background-size:70%;
	cursor:pointer;
	
	position:absolute;
	top:90px;
	right:-100px;
}
#slider > #left{
	transition:0.3s;
	width:50px;
	height:70px;
	background:red url("img/slider/left.png") no-repeat 50%;
	background-size:70%;
	cursor:pointer;

	position:absolute;
	top:90px;
	left:-100px;	
}


</style>

</head>
<body>

<div id="header">  
	<div class="top"> 
		<div class="holder"> 
			<div class="top">  </div>
			<div class="bottom"> 
				<img class="logo" src="images/header_logo.png">
				<input class="search" type="text" placeholder="جستجو . . .">
			</div>
		</div>	
	</div>
	<div class="bottom">  
		<div class="menu"> 	
			<div class="items"> صفحه اصلی </div>
			<div class="items sub"> درباره ملت </div>
			<div class="items"> خدمات </div>
			<div class="items sub"> بانکداری الکترونیکی</div>
			<div class="items it1"> همراه بانک</div>			
		</div>			
	</div>
</div>

<div id="content"> 

	
<div id="slider">
	<div id="gal">
		   <div class="items">
				<img src="images/slider/1.jpg">
				
			</div>
			<div class="items">
				<img src="images/slider/2.jpg">
				
			</div> 
			<div class="items">
				<img src="images/slider/3.jpg">
				
			</div>
			<div class="items">
				<img src="images/slider/4.jpg">
				
			</div>		
			<div class="items">
				<img src="images/slider/5.jpg">
				
			</div>		
			
	</div>
	<div id="right">  </div>	
	<div id="left">  </div>
</div>



</div>
<div id="footer"> 

</div>

<script>

pos = 0;

right.onclick = function(){
	//alert(pos)
	
	if(pos> -400){
		pos = pos -100;
		gal.style.left = pos + "%";
	}
	else if(pos == -400){
		pos = 0;
		gal.style.left = pos + "%";
	}	
}
left.onclick = function(){
	pos = pos + 100;
	gal.style.left = pos + "%";
}
</script>
</body>
</html>
